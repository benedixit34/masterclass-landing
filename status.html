<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="icon" href="./assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Payment Status</title>
  </head>

  <body class="flex min-h-screen items-center justify-center bg-gray-50 px-6 py-12 font-[Poppins]">
    <!-- Payment Status Card -->
    <main class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-lg">
      <div
        id="statusIcon"
        class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full"
      ></div>

      <h1
        id="statusTitle"
        class="mb-3 font-[Montserrat] text-3xl font-semibold text-gray-900"
      ></h1>

      <p
        id="statusMessage"
        class="mb-6 text-sm leading-6 text-gray-500"
      ></p>

      <div class="mb-6 rounded-lg bg-gray-50 p-4 text-left">
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-500">Status</span>
          <span id="paymentStatus" class="text-sm font-medium"></span>
        </div>

        <div
          id="referenceContainer"
          class="mt-3 hidden items-center justify-between border-t border-gray-200 pt-3"
        >
          <span class="text-sm text-gray-500">Reference</span>
          <span
            id="paymentReference"
            class="text-sm font-medium text-gray-700"
          ></span>
        </div>
      </div>

      <p
        id="additionalMessage"
        class="mb-6 text-xs leading-5 text-gray-400"
      ></p>

      <div class="flex flex-col gap-3">
        <a
          id="primaryButton"
          href="./index.html"
          class="w-full rounded-lg bg-[#ff4c00] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#e64400]"
        ></a>

        <a
          href="./index.html"
          class="w-full rounded-lg border border-gray-300 px-5 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
        >
          Back to Home
        </a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);

      const status = params.get("status");
      const reference = params.get("reference");

      const statusIcon = document.getElementById("statusIcon");
      const statusTitle = document.getElementById("statusTitle");
      const statusMessage = document.getElementById("statusMessage");
      const paymentStatus = document.getElementById("paymentStatus");
      const additionalMessage = document.getElementById("additionalMessage");
      const primaryButton = document.getElementById("primaryButton");
      const referenceContainer = document.getElementById("referenceContainer");
      const paymentReference = document.getElementById("paymentReference");

      if (reference) {
        paymentReference.textContent = reference;
        referenceContainer.classList.remove("hidden");
        referenceContainer.classList.add("flex");
      }

      if (status === "success") {
        statusIcon.className =
          "mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-green-50";

        statusIcon.innerHTML = `
          <svg
            class="h-10 w-10 text-green-500"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
        `;

        statusTitle.textContent = "Payment Successful!";

        statusMessage.textContent =
          "Your payment has been received and your masterclass booking has been confirmed.";

        paymentStatus.textContent = "Confirmed";
        paymentStatus.classList.add("text-green-600");

        additionalMessage.textContent =
          "A confirmation and further details will be sent to your email address.";

        primaryButton.textContent = "Back to Home";
      } else {
        statusIcon.className =
          "mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-red-50";

        statusIcon.innerHTML = `
          <svg
            class="h-10 w-10 text-red-500"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        `;

        statusTitle.textContent = "Payment Failed";

        statusMessage.textContent =
          "We couldn't complete your payment. Please try again or use another payment method.";

        paymentStatus.textContent = "Failed";
        paymentStatus.classList.add("text-red-500");

        additionalMessage.textContent =
          "If money was deducted from your account, please contact us with your payment reference.";

        primaryButton.textContent = "Try Again";
      }
    </script>
  </body>
</html>
